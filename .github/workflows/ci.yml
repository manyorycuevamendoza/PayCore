name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (pruebas contra PostgreSQL real)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: paycore
          POSTGRES_PASSWORD: paycore
          POSTGRES_DB: paycore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paycore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Las pruebas crean y destruyen su propia base paycore_test.
      PAYCORE_TEST_ADMIN_URL: postgresql+psycopg://paycore:paycore@localhost:5432/postgres
      PAYCORE_TEST_DATABASE_URL: postgresql+psycopg://paycore:paycore@localhost:5432/paycore_test
      PAYCORE_JWT_SECRET: secreto-solo-para-ci-con-longitud-suficiente-32b

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r backend/requirements-dev.txt

      - name: Pruebas
        run: pytest -v

      - name: Comprobar que la especificación OpenAPI versionada está al día
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, "backend")
          os.environ.setdefault("PAYCORE_DATABASE_URL", os.environ["PAYCORE_TEST_DATABASE_URL"])
          from app.main import create_app
          generada = create_app().openapi()
          ruta = pathlib.Path("docs/openapi.json")
          if not ruta.exists():
              ruta.write_text(json.dumps(generada, indent=2, ensure_ascii=False) + "\n")
              print("docs/openapi.json creado")
              raise SystemExit(0)
          versionada = json.loads(ruta.read_text())
          if versionada != generada:
              print("docs/openapi.json está desactualizado. Regenéralo con scripts/export-openapi.sh")
              raise SystemExit(1)
          print("docs/openapi.json está al día")
          PY

  frontend:
    name: Frontend (tipos y compilación)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Comprobación de tipos
        working-directory: frontend
        run: npm run typecheck

      - name: Compilar
        working-directory: frontend
        run: npm run build
